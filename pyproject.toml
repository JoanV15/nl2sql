[project]
name = "tfm-nlsql"
version = "0.1.0"
description = "NL-to-SQL sobre un Lakehouse gobernado — TFM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "sqlglot>=26",
    "dbt-duckdb>=1.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
landing = [
    "kagglehub>=0.3",
]

[project.scripts]
tfm-nlsql = "tfm_nlsql.interfaz.cli:main"
tfm-nlsql-ui = "tfm_nlsql.interfaz.app:main"
tfm-nlsql-gold = "tfm_nlsql.ingesta.construir_gold:main"
tfm-nlsql-aterrizar = "tfm_nlsql.ingesta.aterrizar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "evaluacion"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
